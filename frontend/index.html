<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar" style="display: none;">
        <div class="nav-container">
            <h1 class="logo">Mini Instagram</h1>
            <div class = "search-wrapper">
            <input type="text" id = "userSearchInput" placeholder="Search users..." autocomplete="off" />
            <button id = "searchBtn">Search</button>

            <div id = "searchResults" class="search-results"></div>  
            </div>
            <!-- above 2line added -->
            <div class="nav-links">
                <a href="javascript:void(0)" onclick="navigateTo('feed')">Home</a>
                <a href="javascript:void(0)" onclick="navigateTo('create')">Create</a>
                <a href="javascript:void(0)" onclick="navigateTo('profile')">Profile</a>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Login & Signup Page -->
    <div id="authPage" class="page active">
        <div class="auth-container">
            <div class="auth-box">
                <h2 id="authTitle">Login to Mini Instagram</h2>
                <form id="authForm">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="email" id="email" placeholder="Email" style="display: none;">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="authSubmitBtn">Login</button>
                </form>
                <p class="auth-toggle">
                    <span id="toggleText">Don't have an account?</span>
                    <a href="javascript:void(0)" id="toggleAuth">Sign up</a>
                </p>
                <div id="authError" class="error-message"></div>
            </div>
        </div>
    </div>

    <!-- Home Feed Page -->
    <div id="feedPage" class="page">
        <div class="container">
            <h2>Your Feed</h2>
            <div id="feedContainer" class="feed-container">
                <p class="loading">Loading feed...</p>
            </div>
        </div>
    </div>

    <!-- Create Post Page -->
    <div id="createPage" class="page">
        <div class="container">
            <div class="create-post-box">
                <h2>Create New Post</h2>
                <form id="createPostForm">
                    <input type="url" id="postImageUrl" placeholder="Image URL" required>
                    <textarea id="postCaption" placeholder="Write a caption..." rows="4"></textarea>
                    <div class="image-preview" id="imagePreview"></div>
                    <button type="submit">Share Post</button>
                </form>
                <div id="createError" class="error-message"></div>
            </div>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profilePage" class="page">
        <div class="container">
            <div class="profile-header">
                <div class="profile-info">
                    <h2 id="profileUsername"></h2>
                    <div class="profile-stats">
                        <span><strong id="postsCount">0</strong> posts</span>
                        <span><strong id="followersCount">0</strong> followers</span>
                        <span><strong id="followingCount">0</strong> following</span>
                    </div>
                    <button id="followBtn" style="display: none;"></button>
                </div>
            </div>
            <div class="profile-posts" id="profilePosts"></div>
        </div>
    </div>

    <!-- Post Detail Modal -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="postDetail" class="post-detail"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
